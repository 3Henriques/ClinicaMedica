name: Criar Issues

on:
  workflow_dispatch:

permissions:
  issues: write
  repository-projects: write
  contents: read

jobs:
  criar-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Setup inicial de issues do projeto
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOKEN_PARA_ACTION }}
          script: |
            const numeroDoProjeto = 1;
            const listaDeIssues = [
              { 
                title: "Ler consultas do Firestore no hook useConsulta", 
                body: "Substituir o estado local (`useState` com `consultasMock`) por um `useEffect` que utilize `onSnapshot` para escutar as mudanças em tempo real da coleção `consultas` no Firestore.\n\n**Por quê:** Para garantir que os dados de consultas exibidos no aplicativo estejam sempre sincronizados com o banco de dados em tempo real para todos os usuários.", 
                labels: ["Estado/Dados"] 
              },
              { 
                title: "Persistir marcação de consulta no Firestore via useConsulta", 
                body: "Alterar a função `marcar` dentro de `useConsulta` para utilizar o método `addDoc` do Firestore. A função deve criar um novo documento na coleção `consultas` com os dados recebidos, substituindo a adição no array em memória.\n\n**Por quê:** Para que a ação de marcar uma consulta crie um registro permanente e compartilhado na nuvem, atendendo ao requisito principal da funcionalidade.", 
                labels: ["Estado/Dados"] 
              },
              { 
                title: "Implementar cálculo dinâmico de disponibilidade no useAgenda", 
                body: "Importar o hook `useConsulta` dentro de `useAgenda`. Alterar a função `buscarSlots` para cruzar a `agendaMock` com a lista de consultas vinda do Firebase. A função deve retornar apenas os horários que ainda não possuem uma consulta marcada.\n\n**Por quê:** Para evitar agendamentos duplicados combinando os horários base (mock) com a ocupação real (Firebase), garantindo precisão na disponibilidade mostrada ao usuário.", 
                labels: ["Estado/Dados"] 
              },
              { 
                title: "Remover estado interno e atualizarStatus do useAgenda", 
                body: "Apagar o `useState` de agenda e deletar a função `atualizarStatus` de dentro do arquivo `useAgenda.ts`. O hook passará a retornar apenas a função `buscarSlots` refatorada e os dados dinâmicos.\n\n**Por quê:** Como a disponibilidade passou a ser calculada dinamicamente cruzando dados, o estado interno tornou-se redundante. Isso simplifica o hook e elimina riscos de inconsistência de dados em memória.", 
                labels: ["Estado/Dados"] 
              },
              { 
                title: "Remover dependência do atualizarStatus na tela MarcarConsulta", 
                body: "No arquivo `MarcarConsulta.tsx`, remover a desestruturação da função `atualizarStatus` vinda do `useAgenda` e deletar a linha de código `atualizarStatus(slot.id, \"M\");` executada no `onPress` do botão \"Confirmar marcacao\" (Etapa 4).\n\n**Por quê:** Com a exclusão do `atualizarStatus` do hook de agenda, mantê-lo na interface causará quebra no código. A tela passará a ser atualizada de forma reativa pelo Firebase assim que o documento for salvo.", 
                labels: ["Estado/Dados"] 
              }
            ];
            
            const coresDasLabels = {
              "Estado/Dados": "e4e669",
              "Mockup": "d93f0b",
              "Componentes": "0075ca",
              "Navegação": "008672",
              "UI": "e99695",
              "Ajustes visuais": "c5def5",
              "Integração futura": "bfd4f2"
            };
            
            for (const [label, cor] of Object.entries(coresDasLabels)) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: cor
                });
                console.log(`Label ${label} criada`);
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Label "${label}" já existe.`);
                } else {
                  console.log(`Erro ao criar "${label}": ${e.message}`);
                }
              }
            }
            
            const issuesExistentes = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            const titulosExistentes = new Set(issuesExistentes.map(i => i.title));
            
            const numerosDasIssuesCriadas = [];
            for (const issue of listaDeIssues) {
              if (titulosExistentes.has(issue.title)) {
                console.log(`Issue "${issue.title}" já existe`);
                continue;
              }
              try {
                const issueCriada = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: issue.labels
                });
                console.log(`Issue #${issueCriada.data.number} criada: ${issue.title}`);
                numerosDasIssuesCriadas.push({
                  number: issueCriada.data.number,
                  node_id: issueCriada.data.node_id
                });
              } catch (e) {
                console.log(`Erro ao criar a issue "${issue.title}": ${e.message}`);
              }
            }
            
            
            if (numerosDasIssuesCriadas.length > 0) {
              console.log(`\nAdicionando ${numerosDasIssuesCriadas.length} issues no projeto #${numeroDoProjeto}...`);
              try {
                const queryProjeto = await github.graphql(`
                  query($owner: String!, $number: Int!) {
                    organization(login: $owner) {
                      projectV2(number: $number) {
                        id
                      }
                    }
                  }
                `, { owner: context.repo.owner, number: numeroDoProjeto });
                
                const projetoId = queryProjeto.organization?.projectV2?.id;
                
                if (projetoId) {
                  for (const { number: numeroDaIssue, node_id: issueId } of numerosDasIssuesCriadas) {
                    try {
                      await github.graphql(`
                        mutation($projectId: ID!, $contentId: ID!) {
                          addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                            item { id }
                          }
                        }
                      `, { projectId: projetoId, contentId: issueId });
                      console.log(`Issue #${numeroDaIssue} adicionada ao projeto.`);
                    } catch (e) {
                      console.log(`Erro ao adicionar a issue #${numeroDaIssue} ao projeto: ${e.message}`);
                    }
                  }
                } else {
                  console.log(`Projeto #${numeroDoProjeto} não encontrado ou não acessível.`);
                }
              } catch (e) {
                console.log(`Erro ao acessar o projeto ${numeroDoProjeto}: ${e.message}`);
              }
            }